<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированный фон для гида</title>
    <style>
        /* Сброс отступов */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Контейнер пузырьков на весь экран */
        .bg-bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #141417; /* тёмный фон, подберите свой */
            z-index: 0;
        }

        /* Каждый пузырёк */
        .bg-bubbles span {
            position: absolute;
            display: block;
            bottom: -60px;
            font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
            animation: bubble-rise linear infinite;
            opacity: 0;
        }

        @keyframes bubble-rise {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

        /* Индивидуальные настройки для 15 иконок */
        .bg-bubbles span:nth-child(1)  { left: 5%;  font-size: 32px; animation-delay: 0s;  animation-duration: 12s; }
        .bg-bubbles span:nth-child(2)  { left: 12%; font-size: 48px; animation-delay: 1s;  animation-duration: 14s; }
        .bg-bubbles span:nth-child(3)  { left: 20%; font-size: 24px; animation-delay: 3s;  animation-duration: 10s; }
        .bg-bubbles span:nth-child(4)  { left: 28%; font-size: 40px; animation-delay: 2s;  animation-duration: 13s; }
        .bg-bubbles span:nth-child(5)  { left: 36%; font-size: 28px; animation-delay: 5s;  animation-duration: 11s; }
        .bg-bubbles span:nth-child(6)  { left: 44%; font-size: 52px; animation-delay: 4s;  animation-duration: 15s; }
        .bg-bubbles span:nth-child(7)  { left: 52%; font-size: 36px; animation-delay: 6s;  animation-duration: 10s; }
        .bg-bubbles span:nth-child(8)  { left: 60%; font-size: 26px; animation-delay: 3s;  animation-duration: 12s; }
        .bg-bubbles span:nth-child(9)  { left: 68%; font-size: 44px; animation-delay: 7s;  animation-duration: 14s; }
        .bg-bubbles span:nth-child(10) { left: 76%; font-size: 30px; animation-delay: 1s;  animation-duration: 9s;  }
        .bg-bubbles span:nth-child(11) { left: 84%; font-size: 38px; animation-delay: 8s;  animation-duration: 13s; }
        .bg-bubbles span:nth-child(12) { left: 90%; font-size: 22px; animation-delay: 2s;  animation-duration: 11s; }
        .bg-bubbles span:nth-child(13) { left: 95%; font-size: 46px; animation-delay: 6s;  animation-duration: 16s; }
        .bg-bubbles span:nth-child(14) { left: 1%;  font-size: 34px; animation-delay: 4s;  animation-duration: 12s; }
        .bg-bubbles span:nth-child(15) { left: 50%; font-size: 56px; animation-delay: 9s;  animation-duration: 14s; }

        /* Контент поверх пузырьков */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: #fff;
            font-family: 'Spectral', Georgia, serif;
            padding: 20px;
        }
        .content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .content p {
            font-size: 1.2rem;
            max-width: 600px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        /* Адаптив */
        @media (max-width: 600px) {
            .content h1 { font-size: 2rem; }
            .content p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-bubbles">
        <!-- Замените символы на свои (кофе, чай, коктейли) -->
        <span>☕</span> <span>🍃</span> <span>💨</span> <span>🫖</span> <span>🔥</span>
        <span>🍸</span> <span>🧊</span> <span>~</span>   <span>°</span>   <span>•</span>
        <span>🍺</span> <span>🧉</span> <span>🥃</span> <span>☕</span> <span>🍵</span>
    </div>

    <div class="content">
        <h1>🍺 Гид по варке напитков</h1>
        <p>Рецепты, оборудование, секреты мастерства.<br>Погрузитесь в мир ароматов.</p>
    </div>
</body>
</html>
